<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Novo projeto | LearnHub</title>

    <script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <div data-nav></div>

    <main class="form-page">

        <form
            id="projectForm"
            class="form-card panel"
        >

            <span class="badge">
                Para sua escola
            </span>

            <h1>
                Adicionar projeto
            </h1>

            <p class="form-lead muted">
                Apresente a iniciativa com clareza para encontrar os apoiadores certos.
            </p>

            <label>
                Título
                <input
                    name="titulo"
                    maxlength="80"
                    placeholder="Ex.: Biblioteca comunitária"
                    required
                >
            </label>

            <label>
                Descrição
                <textarea
                    name="descricao"
                    maxlength="600"
                    placeholder="Conte o contexto do projeto e quem será beneficiado"
                    required
                ></textarea>
            </label>

            <label>
                Objetivo
                <textarea
                    name="objetivo"
                    maxlength="400"
                    placeholder="Qual resultado a escola quer alcançar?"
                    required
                ></textarea>
            </label>

            <label>
                Categoria

                <select name="categoria">

                    <option>
                        Tecnologia
                    </option>

                    <option>
                        Ciência
                    </option>

                    <option>
                        Leitura
                    </option>

                    <option>
                        Sustentabilidade
                    </option>

                    <option>
                        Infraestrutura
                    </option>

                    <option>
                        Outro
                    </option>

                </select>

            </label>

            <label>
                Recursos necessários
                <input
                    name="recursos"
                    maxlength="300"
                    placeholder="Ex.: livros, estantes e apoio de voluntários"
                    required
                >
            </label>

            <label>
                Capa e banner do projeto
                <input id="projectImageFile" type="file" accept="image/jpeg,image/png,image/webp">
                <small>JPG, PNG ou WebP · até 3 MB. A mesma imagem será usada na capa e no banner. Prefira uma foto horizontal.</small>
                <img id="projectImagePreview" alt="Prévia da capa do projeto" hidden>
                <button class="btn" id="removeProjectImage" type="button">Remover imagem</button>
                <span>Ou use um emoji ou endereço de imagem</span>
                <input
                    name="imagem"
                    placeholder="Ex.: 🌱"
                >
            </label>

            <label>
                Status

                <select name="status">

                    <option>
                        Planejamento
                    </option>

                    <option>
                        Em andamento
                    </option>

                    <option>
                        Concluído
                    </option>

                </select>

            </label>

            <div class="form-actions">
                <a class="btn" id="cancelProject" href="hub.html">
                    Cancelar
                </a>

                <button class="btn btn-primary" id="submitProject" type="submit">
                    Publicar projeto
                </button>
            </div>

        </form>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/adicionar-projeto.js"></script>

</body>

</html>
