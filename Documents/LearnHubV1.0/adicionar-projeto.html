<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Novo projeto | LearnHub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <div data-nav></div>

    <main class="form-page">

        <form
            id="projectForm"
            class="form-card panel"
        >

            <span class="badge">
                Para sua escola
            </span>

            <h1>
                Adicionar projeto
            </h1>

            <label>
                Título
                <input
                    name="titulo"
                    required
                >
            </label>

            <label>
                Descrição
                <textarea
                    name="descricao"
                    required
                ></textarea>
            </label>

            <label>
                Objetivo
                <textarea
                    name="objetivo"
                    required
                ></textarea>
            </label>

            <label>
                Categoria

                <select name="categoria">

                    <option>
                        Tecnologia
                    </option>

                    <option>
                        Ciência
                    </option>

                    <option>
                        Leitura
                    </option>

                    <option>
                        Sustentabilidade
                    </option>

                    <option>
                        Infraestrutura
                    </option>

                    <option>
                        Outro
                    </option>

                </select>

            </label>

            <label>
                Recursos necessários
                <input
                    name="recursos"
                    required
                >
            </label>

            <label>
                Imagem/banner (emoji ou URL opcional)
                <input
                    name="imagem"
                    placeholder="Ex.: 🌱"
                >
            </label>

            <label>
                Status

                <select name="status">

                    <option>
                        Planejamento
                    </option>

                    <option>
                        Em andamento
                    </option>

                    <option>
                        Concluído
                    </option>

                </select>

            </label>

            <button class="btn btn-primary">
                Publicar projeto
            </button>

        </form>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/adicionar-projeto.js"></script>

</body>

</html>
