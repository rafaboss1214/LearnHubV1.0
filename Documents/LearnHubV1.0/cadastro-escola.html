<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Cadastro de escola | LearnHub</title>

    <script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <header class="container nav public-nav">

        <a class="brand" href="index.html">
            LearnHub
        </a>

        <div class="nav-actions">
            <button
                class="theme-toggle"
                type="button"
                data-theme-toggle
            ></button>

            <a class="btn" href="cadastro.html">
                Voltar
            </a>
        </div>

    </header>

    <main class="form-page">

        <form
            class="form-card panel register-form"
            data-type="escola"
        >

            <span class="badge">
                Cadastro de escola
            </span>

            <h1>
                Publique seu impacto
            </h1>

            <label>
                Nome da escola
                <input
                    name="nome"
                    required
                >
            </label>

            <label>
                E-mail
                <input
                    type="email"
                    name="email"
                    required
                >
            </label>

            <label>
                Senha
                <input
                    type="password"
                    name="senha"
                    minlength="6"
                    required
                >
            </label>

            <label>
                Confirmar senha
                <input
                    type="password"
                    name="confirmar"
                    minlength="6"
                    required
                >
            </label>

            <label>
                Endereço
                <input
                    name="endereco"
                    required
                >
            </label>

            <div class="two">

                <label>
                    Cidade
                    <input
                        name="cidade"
                        required
                    >
                </label>

                <label>
                    Estado
                    <input
                        name="estado"
                        maxlength="2"
                        required
                    >
                </label>

            </div>

            <button class="btn btn-primary">
                Cadastrar escola
            </button>

        </form>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
