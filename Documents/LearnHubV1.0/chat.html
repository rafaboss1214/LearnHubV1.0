<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens | LearnHub</title><script src="js/theme.js"></script><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/chat.css"></head>
<body><div data-nav></div><main class="container chat-page"><span class="badge">Conexões que viram impacto</span><h1>Mensagens</h1><p class="muted">Converse com quem está construindo o projeto com você.</p><p id="connectionStatus" role="status">Conectando…</p>
<div class="chat-layout panel"><aside class="chat-sidebar"><h2>Conversas</h2><label class="sr-only" for="conversationSearch">Buscar conversa</label><input id="conversationSearch" type="search" placeholder="Buscar pessoa ou projeto"><div id="conversations"></div></aside>
<section class="chat-main" aria-label="Conversa"><header id="conversationHeader"><h2>Escolha uma conversa</h2></header><div id="messages" role="log" aria-live="polite" aria-relevant="additions text"><p class="muted">Apoie um projeto para começar a conversar com a escola.</p></div><form id="messageForm" hidden><div class="composer-box"><label class="sr-only" for="messageText">Sua mensagem</label><textarea id="messageText" maxlength="2000" rows="1" placeholder="Escreva sua mensagem…" required aria-describedby="composerHint"></textarea><button class="btn btn-primary chat-send" type="submit" aria-label="Enviar mensagem"><span class="send-label">Enviar</span><span class="send-icon" aria-hidden="true">↗</span></button></div><div class="composer-actions"><small id="composerHint">Enter envia · Shift + Enter quebra a linha</small><small id="characterCount">0 / 2.000</small></div></form></section></div></main>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/local-chat.js"></script><script src="js/chat.js"></script></body></html>
