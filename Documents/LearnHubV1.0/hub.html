<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Projetos | LearnHub</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hub.css">
</head>

<body>

    <div data-nav></div>

    <main class="container hub">

        <section class="hub-top">

            <div>

                <span class="badge">
                    Hub de Projetos
                </span>

                <h1 class="page-title" id="greeting">
                    Olá!
                </h1>

                <p class="muted">
                    Veja projetos que estão transformando a educação.
                </p>

            </div>

            <div
                class="mini-level panel"
                id="miniLevel"
            ></div>

        </section>

        <section class="controls panel">

            <input
                id="search"
                placeholder="Busque por projeto, escola ou categoria"
            >

            <div
                class="filters"
                id="filters"
            >

                <button
                    class="active"
                    data-filter="Todos"
                >
                    Todos
                </button>

                <button
                    data-filter="Planejamento"
                >
                    Em planejamento
                </button>

                <button
                    data-filter="Em andamento"
                >
                    Em andamento
                </button>

                <button
                    data-filter="Concluído"
                >
                    Concluídos
                </button>

            </div>

        </section>

        <section
            id="cards"
            class="project-grid"
        ></section>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/hub.js"></script>

</body>

</html>
