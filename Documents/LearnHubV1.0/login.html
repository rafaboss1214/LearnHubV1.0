<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar | LearnHub</title>

    <script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <header class="container nav public-nav">

        <a class="brand" href="index.html">
            LearnHub
        </a>

        <div class="nav-actions">
            <button
                class="theme-toggle"
                type="button"
                data-theme-toggle
            ></button>

            <a class="btn btn-compact" href="index.html">
                Início
            </a>
        </div>

    </header>

    <main class="form-page">

        <form id="loginForm" class="form-card panel">

            <span class="badge">
                Bem-vindo de volta
            </span>

            <h1>
                Entre na LearnHub
            </h1>

            <p class="muted">
                Continue construindo impacto na educação.
            </p>

            <label>
                E-mail
                <input type="email" name="email" required>
            </label>

            <label>
                Senha
                <input type="password" name="senha" required>
            </label>

            <button class="btn btn-primary" type="submit">
                Entrar
            </button>

            <a
                class="muted small"
                href="conta.html"
            >
                Esqueceu sua senha?
            </a>

            <p class="muted">
                Ainda não possui uma conta?
                <a class="link" href="cadastro.html">
                    Cadastre-se
                </a>
            </p>

        </form>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
